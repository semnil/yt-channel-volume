name: CI
run-name: ${{ github.ref_name }} CI ✅

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test 🧪
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set Up Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Unit Tests ✅
        run: node test.js

      - name: Run Navigation Tests ✅
        run: node test-navigation.js

      - name: Set Up Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Pillow 🖼️
        run: pip install pillow==12.2.0
        timeout-minutes: 5

      - name: Check Screenshots 📸
        run: python3 gen_screenshots.py --check
