name: CI
run-name: ${{ github.ref_name }} CI ✅

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test 🧪
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Node 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Set Up Python 🐍
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Before the tests: what test.js spawns skips itself where the generator
      # cannot draw, and a skip holds nothing.
      - name: Install Pillow 🖼️
        run: pip install pillow==12.2.0
        timeout-minutes: 5

      - name: Run Unit Tests ✅
        run: node test.js

      - name: Run Navigation Tests ✅
        run: node test-navigation.js

      - name: Run Screenshot Path Tests ✅
        run: python3 test-screenshots.py

      - name: Check Screenshots 📸
        id: screenshots
        run: python3 gen_screenshots.py --check

      - name: Draw Them Again For Inspection 🖼️
        id: redraw
        if: failure() && steps.screenshots.conclusion == 'failure'
        run: python3 gen_screenshots.py --out ${{ runner.temp }}/screenshots-from-ci

      - name: Upload What The Runner Drew 📡
        if: failure() && steps.redraw.conclusion == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-from-ci
          path: ${{ runner.temp }}/screenshots-from-ci/
          if-no-files-found: error
